<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">

    <title>Contact</title>

    
    <link rel="stylesheet" href="./assets/css/styles.css">
    
    <!-- Custom styles for this template -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // https://dashboard.emailjs.com/admin/account
            emailjs.init('nRTm6yqP4fE1PvTX3');
        })();
    </script>
    <script type="text/javascript">
        window.onload = function() {
            document.getElementById('contact-form').addEventListener('submit', function(event) {
                event.preventDefault();
                // generate a five digit number for the contact_number variable
                this.contact_number.value = Math.random() * 100000 | 0;
                // these IDs from the previous steps
                emailjs.sendForm('service_8fa6sia', 'template_ihn9to3', this)
                    .then(function() {
                        console.log('SUCCESS!');
                        document.getElementById('messageSent').style.display = 'block';
                        setTimeout(function() {window.location.assign('index.html')}, 2000)
                        
                    }, function(error) {
                        console.log('FAILED...', error);
                    });
            });
        }
    </script>
</head>

<body>

    <header>
        <h1>
            Hello, I am Jili Jiang
        </h1>
        <nav>
            <ul>
                <li>
                    <a href="https://wpshowcase.net">About Me</a>
                </li>
                <li>
                    <a href="https://www.youtube.com/@jilijiang6640/videos">Channel</a>
                </li>
                <li>
                    <a href="https://jilijiang.github.io/My-Portfolio-REACT/">Portfolio</a>
                </li>
                <li>
                    <a href="#contact">Contact</a>
                </li>


            </ul>
        </nav>
    </header>
    <!-- end navigation -->

    <!-- hero start -->
    <section class="hero">
        <h2>Contact Me with your specific case</h2>
    </section>
    <!-- end hero -->

    <div></br></br></div>
    <main>

        <div class="contact">
        <form id="contact-form">
            <input type="hidden" name="contact_number">
            <label class="contact-info">Name</label>
            <input class="contact-info" style="margin-bottom: 10px;" type="text" name="name">
            <br />
            <label class="contact-info">Email</label>
            <input class="contact-info" style="margin-bottom: 10px;" type="email" name="email">
            <br />
            <label class="contact-info">Message</label>
            <textarea class="contact-info" style="margin-bottom: 10px;" name="message" style="height: 150px"></textarea>
            <br />
            <input class="contact-btn" style="margin-top: 10px;" type="submit" value="Send">
        </form>
        <h3 id="messageSent" style="display: none; color:black"> You Message has been Sent !</h3>
        </div>
        <section style="display: flex; background-color: black; justify-content: center; color: white">

            <div id="contact" style="font-family: Times New Roman; margin-right: 20px">
                <h5 style="font-size: 18px;"> <span>&copy;</span> Jili Jiang 2023, All Rights Reserved.</h5>
 
            </div>
            <svg style="margin-right: 20px" xmlns="http://www.w3.org/2000/svg" width="25" height="25"
                fill="currentColor" class="bi bi-vector-pen" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M10.646.646a.5.5 0 0 1 .708 0l4 4a.5.5 0 0 1 0 .708l-1.902 1.902-.829 3.313a1.5 1.5 0 0 1-1.024 1.073L1.254 14.746 4.358 4.4A1.5 1.5 0 0 1 5.43 3.377l3.313-.828L10.646.646zm-1.8 2.908-3.173.793a.5.5 0 0 0-.358.342l-2.57 8.565 8.567-2.57a.5.5 0 0 0 .34-.357l.794-3.174-3.6-3.6z" />
                <path fill-rule="evenodd" d="M2.832 13.228 8 9a1 1 0 1 0-1-1l-4.228 5.168-.026.086.086-.026z" />
            </svg>


        </section>
    </main>
